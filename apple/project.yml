name: Drussky
options:
  bundleIdPrefix: software.ember
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
  # The learner's own device build: Release, plus PrivatePack (personal-study audio that must
  # never ship in a distributed archive). Deploy with -configuration Personal.
  Personal: release
settings:
  base:
    DEVELOPMENT_TEAM: 992772WV7K
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  LearningCore:
    type: framework
    platform: iOS
    sources:
      - path: LearningCore
        excludes:
          - "*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: software.ember.learningcore
        GENERATE_INFOPLIST_FILE: YES
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        SKIP_INSTALL: YES
  LearningCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LearningCoreTests]
    dependencies:
      - target: LearningCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: software.ember.learningcore.tests
        GENERATE_INFOPLIST_FILE: YES
  Drussky:
    type: application
    platform: iOS
    dependencies:
      - target: LearningCore
    sources:
      - path: Drussky
        excludes:
          - "Resources/Audio"
          - "Resources/Models"
          - "*.entitlements"
      - path: Drussky/Resources/Audio
        type: folder
        buildPhase: resources
      # The phone recognizer (not in git): python3 scripts/models.py fetch
      - path: Drussky/Resources/Models
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: software.ember.drussky
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Drussky/Drussky-mac.entitlements
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_CFBundleDisplayName: Drussky
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Drussky listens when you say Russian aloud, and keeps your recording on the page."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Drussky checks the Russian you say aloud."
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: PrivatePack (Debug and Personal only)
        basedOnDependencyAnalysis: false
        script: |
          dest="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/PrivatePack"
          rm -rf "$dest"
          case "$CONFIGURATION" in
            Debug|Personal)
              if [ -d "$SRCROOT/PrivatePack" ]; then cp -R "$SRCROOT/PrivatePack" "$dest"; fi ;;
            *) ;;
          esac
  DrusskyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - DrusskyTests
      # The on-device tutor benchmark's cases (research/ONDEVICE_TUTOR.md), run by OnDeviceTutorTests where the model exists.
      - path: ../research/ondevice/cases.json
        buildPhase: resources
        # Pinned to this group: left to createIntermediateGroups, xcodegen would nest it under a
        # group named after the checkout directory, so the pbxproj differed per worktree.
        group: DrusskyTests
    dependencies:
      - target: Drussky
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: software.ember.drussky.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Drussky.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Drussky"
        BUNDLE_LOADER: "$(TEST_HOST)"
  # Vision over hundreds of ink samples (InkReaderSlowTests): minutes on the simulator, apart from
  # the fast loop. scripts/test.sh slow.
  DrusskySlowTests:
    type: bundle.unit-test
    platform: iOS
    sources: [DrusskySlowTests]
    dependencies:
      - target: Drussky
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: software.ember.drussky.slowtests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Drussky.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Drussky"
        BUNDLE_LOADER: "$(TEST_HOST)"
  DrusskyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [DrusskyUITests]
    dependencies:
      - target: Drussky
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: software.ember.drussky.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Drussky
        SUPPORTS_MACCATALYST: NO
schemes:
  Drussky:
    build:
      targets:
        Drussky: all
        LearningCore: all
    test:
      targets: [LearningCoreTests, DrusskyTests, DrusskySlowTests, DrusskyUITests]
