name: Drussky
options:
  bundleIdPrefix: software.ember
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 992772WV7K
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Drussky:
    type: application
    platform: iOS
    sources:
      - path: Drussky
        excludes:
          - "Resources/Audio"
          - "*.entitlements"
      - path: Drussky/Resources/Audio
        type: folder
        buildPhase: resources
      - path: PrivatePack
        type: folder
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: software.ember.drussky
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Drussky/Drussky-mac.entitlements
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_CFBundleDisplayName: Drussky
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Drussky listens when you say Russian aloud, and keeps your recording on the page."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Drussky checks the Russian you say aloud."
        GENERATE_INFOPLIST_FILE: YES
  DrusskyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [DrusskyTests]
    dependencies:
      - target: Drussky
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: software.ember.drussky.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Drussky.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Drussky"
        BUNDLE_LOADER: "$(TEST_HOST)"
  DrusskyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [DrusskyUITests]
    dependencies:
      - target: Drussky
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: software.ember.drussky.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Drussky
        SUPPORTS_MACCATALYST: NO
schemes:
  Drussky:
    build:
      targets:
        Drussky: all
    test:
      targets: [DrusskyTests, DrusskyUITests]
