[workspace]
members = ["crates/rufren-core", "crates/rufren-store", "crates/rufren-relay", "crates/rufren-app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rufren-core = { path = "crates/rufren-core" }
rufren-store = { path = "crates/rufren-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde", "js"] }
thiserror = "2"
rusqlite = { version = "0.37", features = ["bundled"] }

[profile.dev]
debug = 1

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
