[workspace]
members = ["crates/rufren-core", "crates/rufren-store", "crates/rufren-relay", "crates/rufren-app", "crates/rufren-content", "crates/rufren-audio", "crates/rufren-tutor", "crates/rufren-tutor-contract", "crates/rufren-speech"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rufren-core = { path = "crates/rufren-core" }
rufren-store = { path = "crates/rufren-store" }
rufren-content = { path = "crates/rufren-content" }
rufren-audio = { path = "crates/rufren-audio" }
rufren-tutor = { path = "crates/rufren-tutor", default-features = false }
rufren-tutor-contract = { path = "crates/rufren-tutor-contract" }
rufren-speech = { path = "crates/rufren-speech", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v5", "serde", "js"] }
thiserror = "2"
rusqlite = { version = "0.37", features = ["bundled"] }

[profile.dev]
debug = 1

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
