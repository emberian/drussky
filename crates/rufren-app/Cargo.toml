[package]
name = "rufren-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[dependencies]
rufren-core.workspace = true
rufren-content.workspace = true
rufren-audio.workspace = true
base64 = "0.22"
sha2 = "0.10"
rufren-tutor = { workspace = true, default-features = false }
rufren-speech = { workspace = true, default-features = false }
pulldown-cmark = "0.13"
dioxus = { version = "=0.7.10", default-features = false, features = ["macro", "html", "signals", "hooks", "launch", "document"] }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rufren-store.workspace = true
directories = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage", "Location"] }
js-sys = "0.3"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
security-framework = "3.7"
objc2 = "0.6.5"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSArray", "NSData", "NSError", "NSFileManager", "NSObject", "NSOperation", "NSPathUtilities", "NSString", "NSThread", "NSURL", "NSURLRequest", "NSURLResponse"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "WKDownload", "WKDownloadDelegate", "WKWebView"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSApplication", "NSPanel", "NSSavePanel", "NSWindow"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSTimer", "NSRunLoop", "NSNotification", "NSDate"] }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-core-foundation", "UIActivity", "UIActivityViewController", "UIPopoverPresentationController", "UIPresentationController", "UIResponder", "UIView", "UIViewController", "UIWindow", "UIScrollView", "UIGestureRecognizer", "UIControl", "UIButton", "UILabel", "UIFont", "UIColor", "UIInterface", "UIBezierPath", "UIApplication", "UIGeometry"] }
objc2-pencil-kit = { version = "0.3.2", default-features = false, features = ["std", "PKDrawing", "PKStroke", "PKStrokePath", "PKStrokePoint", "PKFloatRange", "PKInk", "PKInkType", "PKTool", "PKInkingTool", "PKEraserTool", "PKContentVersion", "objc2-core-foundation"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes", "objc2"] }

[dev-dependencies]
dioxus-ssr = "=0.7.10"
rusqlite.workspace = true
