[application]
name = "Rufren"
default_platform = "web"
public_dir = "public"
android_min_sdk_version = 24

[web.app]
title = "Rufren — Russian, your way"

[web.watcher]
watch_path = ["src", "public", "index.html"]

[bundle]
identifier = "town.lunar.rufren"
publisher = "Ember Arlynx"
category = "Education"
short_description = "Your Russian notebook, on your devices."
icon = ["public/icons/icon-512.png"]

# Dioxus 0.7.10 maps these into Info.plist / AndroidManifest.xml.
# Permission declarations do not replace the user's runtime consent.
[permissions]
microphone = { description = "Record your Russian practice so you can listen back and compare." }

[ios]
deployment_target = "15.0"

[ios.plist]
MinimumOSVersion = "15.0"
NSLocalNetworkUsageDescription = "Connect to your private Rufren library on your local network."

[macos]
minimum_system_version = "12.0"

[macos.plist]
NSHighResolutionCapable = true
LSApplicationCategoryType = "public.app-category.education"

[macos.entitlements]
app-sandbox = true
network-client = true
network-server = true
files-user-selected = true
# The 0.7.10 microphone shortcut emits device.microphone. Apple requires
# device.audio-input; use the verified literal key instead.
"com.apple.security.device.audio-input" = true

[android]
min_sdk = 24
target_sdk = 36
compile_sdk = 36

[android.permissions]
"android.permission.INTERNET" = { description = "Sync with your private relay when you choose." }
"android.permission.MODIFY_AUDIO_SETTINGS" = { description = "Play and record your Russian practice." }
